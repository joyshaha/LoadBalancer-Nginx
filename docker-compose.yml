services:
  app1:
    build:
      context: ./app1
      dockerfile: Dockerfile
    container_name: app1
    networks:
      - app-network

  app2:
    build: 
      context: ./app2
      dockerfile: Dockerfile
    container_name: app2
    networks:
      - app-network

  lb4:
    build: ./lb4
    container_name: layer4
    ports:
      - "8084:80"
    depends_on:
      - app1
      - app2
    networks:
      - app-network

  lb7:
    build: ./lb7
    container_name: layer7
    ports:
      - "8087:80"
    depends_on:
      - app1
      - app2
    networks:
      - app-network

  lb:
    build: ./lb
    container_name: webserver
    ports:
      - "80:80"
      - "3304:3304"
    depends_on:
      - app1
      - app2
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
